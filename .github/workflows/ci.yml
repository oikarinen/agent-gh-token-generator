name: Go CI and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  GORELEASER_VERSION: v2.18.2

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.26' ]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false # no module dependencies to cache
      - name: Tidy
        run: go mod tidy
      - name: Verify go.mod and go.sum unchanged
        run: git diff --exit-code -- go.mod go.sum
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -race -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache: false # no module dependencies to cache
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.11.4

  wrapper:
    name: Wrapper script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: ShellCheck
        run: shellcheck bin/agent-github-token test/*.sh
      - name: Test
        run: test/agent-github-token_test.sh

  release-check:
    name: Release check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache: false # no module dependencies to cache
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true
      - name: Check config
        run: goreleaser check
      - name: Snapshot build
        run: goreleaser release --snapshot --clean
      - name: Verify archive layout
        # The wrapper looks for the helper in its own directory.
        run: |
          for archive in dist/*.tar.gz; do
            contents="$(tar -tzf "${archive}")"
            printf '%s:\n%s\n' "${archive}" "${contents}"
            grep -qx 'bin/gh-app-token-generator' <<< "${contents}"
            grep -qx 'bin/agent-github-token' <<< "${contents}"
          done

  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build, lint, wrapper, release-check ]
    permissions:
      contents: write # create the GitHub release and upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache: false # no module dependencies to cache
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
